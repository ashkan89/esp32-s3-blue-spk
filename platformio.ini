; ESP32 WROOM-32D  ->  Bluetooth A2DP sink  ->  PCM5102A I2S DAC
;
; NOTE: This must be a *classic* ESP32 (WROOM-32/32D/32E).
;       ESP32-S3 / C3 / S2 have BLE only and cannot run A2DP.
;
; Uses https://github.com/pschatzmann/ESP32-A2DP as documented upstream, which
; means the AudioTools I2SStream API rather than the retired legacy I2S driver.
; That combination needs Arduino core 3.x / IDF 5.x, which the official
; platformio espressif32 platform never shipped -- hence the pioarduino build.

; The IDF 5 package ships headers whose paths exceed the 260-char Windows limit,
; and this machine has LongPathsEnabled=0. Keeping the toolchain at a short root
; buys back enough characters to unpack it. Delete this section once long paths
; are enabled (see README) and the toolchain will live in ~/.platformio again.
[platformio]
core_dir = C:/p

[env]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/55.03.311/platform-espressif32.zip
board = esp32dev
framework = arduino

; Device Guard can block the unsigned esptool.exe launcher created in the
; PlatformIO virtual environment. Run the same installed package through the
; environment's allowed Python interpreter for both image creation and upload.
extra_scripts =
    pre:scripts/device_guard_pre.py
    pre:scripts/embed_web.py
    scripts/python_esptool.py

monitor_speed = 115200
monitor_filters = esp32_exception_decoder, time

; This board carries a 16 MB flash chip. The standard 16 MB layout provides two
; 6.25 MB OTA application slots plus 3.375 MB of filesystem space.
board_upload.flash_size = 16MB
board_build.partitions = default_16MB.csv

; Neither pschatzmann library is in the PlatformIO registry; they come straight
; from GitHub, pinned to a tag so a build is reproducible.
;
;   arduino-audio-tools  the stream/codec framework everything audio sits on.
;                        ESP32-A2DP needs it -- a hard dependency, not an option.
;   ESP32-A2DP           the Bluetooth Classic A2DP sink (Bluetooth mode).
;
; There is deliberately no BLE library here. On 4.2 silicon BLE could only ever
; have been a control channel -- LE Audio is 5.2 hardware -- and the dashboard
; and the setup access point already are one. See the note on RadioMode in
; management.h.
;
; The WS2812 ring deliberately has no library. Its wire protocol is forty lines
; of RMT symbol building in leds.cpp, and the obvious library (Adafruit
; NeoPixel) puts its transmit path in IRAM -- which this firmware, with the
; Bluetooth and Wi-Fi stacks both wanting some, does not have to spare: adding
; it overflowed iram0_0_seg by 216 bytes and would not link. The core's own RMT
; driver does the same job from flash.
lib_deps =
    https://github.com/pschatzmann/arduino-audio-tools.git#v1.2.5
    https://github.com/pschatzmann/ESP32-A2DP.git#v1.8.11
    olikraus/U8g2@^2.35.30
    bblanchon/ArduinoJson@^7.4.2


; CORE_DEBUG_LEVEL must stay low. The IDF's Bluetooth stack logs from inside the
; audio path, and pushing that much text out of a 115200 baud UART stalls the
; I2S writer long enough to underrun the DMA buffers -- which sounds like static.
;
; USE_DS3231 compiles in the hardware clock. The module is fitted here, on the
; same I2C pair as the OLED (GPIO21 SDA / GPIO22 SCL), and it is the only time
; source that survives a power cut -- so the clock comes up right with no network
; and nothing to set by hand. Harmless on a board without one: soft_clock_begin()
; probes 0x68, logs that it found nothing, and falls back to network/NVS time.
build_flags =
    -DCORE_DEBUG_LEVEL=1
    -DUSE_DS3231=1

; The PSRAM cache workaround, switched off.
;
; The platform compiles every board the same way, which means with the silicon
; erratum workaround for ESP32 revisions below 3 -- a memw barrier after loads
; and stores, plus the matching multilib of libc. The bug it works around only
; exists when external SPI RAM is in use, and a WROOM-32D has none: this board
; has 16 MB of *flash* and 520 KB of internal SRAM, and nothing here ever
; touches a PSRAM address.
;
; It is switched off for room rather than for speed. IDF maps the whole of the
; workaround build of libc into IRAM, and IRAM is the one memory on this chip
; that cannot be traded for any other -- the Bluetooth controller alone takes
; 32 KB of it. Adding the WS2812 driver overflowed the segment by 216 bytes and
; would not link; without the barriers libc is smaller and it fits, with room
; left over. The barriers themselves cost throughput on the audio path too, so
; nothing is given up here.
build_unflags =
    -mfix-esp32-psram-cache-issue
    -mfix-esp32-psram-cache-strategy=memw


; ---------------------------------------------------------------------------
; esp32-blue-spk production firmware.
[env:esp32dev]
