; ESP32 WROOM-32D  ->  Bluetooth A2DP sink  ->  PCM5102A I2S DAC
;
; NOTE: This must be a *classic* ESP32 (WROOM-32/32D/32E).
;       ESP32-S3 / C3 / S2 have BLE only and cannot run A2DP.
;
; Uses https://github.com/pschatzmann/ESP32-A2DP as documented upstream, which
; means the AudioTools I2SStream API rather than the retired legacy I2S driver.
; That combination needs Arduino core 3.x / IDF 5.x, which the official
; platformio espressif32 platform never shipped -- hence the pioarduino build.

; The IDF 5 package ships headers whose paths exceed the 260-char Windows limit,
; and this machine has LongPathsEnabled=0. Keeping the toolchain at a short root
; buys back enough characters to unpack it. Delete this section once long paths
; are enabled (see README) and the toolchain will live in ~/.platformio again.
[platformio]
core_dir = C:/p

[env]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/55.03.311/platform-espressif32.zip
board = esp32dev
framework = arduino

; Device Guard can block the unsigned esptool.exe launcher created in the
; PlatformIO virtual environment. Run the same installed package through the
; environment's allowed Python interpreter for both image creation and upload.
extra_scripts =
    pre:scripts/device_guard_pre.py
    pre:scripts/embed_web.py
    scripts/python_esptool.py

monitor_speed = 115200
monitor_filters = esp32_exception_decoder, time

; This board carries a 16 MB flash chip. The standard 16 MB layout provides two
; 6.25 MB OTA application slots plus 3.375 MB of filesystem space.
board_upload.flash_size = 16MB
board_build.partitions = default_16MB.csv

; Neither pschatzmann library is in the PlatformIO registry; they come straight
; from GitHub, pinned to a tag so a build is reproducible.
;
;   arduino-audio-tools  the stream/codec framework everything audio sits on.
;                        ESP32-A2DP needs it -- a hard dependency, not an option.
;   ESP32-A2DP           the Bluetooth Classic A2DP sink (Bluetooth mode).
;
; There is deliberately no BLE library here. On 4.2 silicon BLE could only ever
; have been a control channel -- LE Audio is 5.2 hardware -- and the dashboard
; and the setup access point already are one. See the note on RadioMode in
; management.h.
;
; The WS2812 ring deliberately has no library. Its wire protocol is forty lines
; of RMT symbol building in leds.cpp, and the obvious library (Adafruit
; NeoPixel) puts its transmit path in IRAM -- which this firmware, with the
; Bluetooth and Wi-Fi stacks both wanting some, does not have to spare: adding
; it overflowed iram0_0_seg by 216 bytes and would not link. The core's own RMT
; driver does the same job from flash.
;   arduino-libhelix        the MP3 and AAC decoders the internet radio runs on.
;                           Fixed-point, and the only pair small enough to
;                           decode a 128 kbps stream in the ~250 KB of heap that
;                           is left in Wi-Fi mode. Between them they cover
;                           essentially every Shoutcast and Icecast station;
;                           Ogg and Opus are not offered because no decoder for
;                           either fits. Pulled in only by net_radio.cpp, and
;                           the linker drops the whole of it in a build that
;                           does not reference the radio.
;   PubSubClient            MQTT, for the Home Assistant integration. Small,
;                           synchronous, and serviced from loop() alongside the
;                           web server -- which is the right shape here, because
;                           the alternative is another task contending for the
;                           same socket layer the radio is streaming through.
lib_deps =
    https://github.com/pschatzmann/arduino-audio-tools.git#v1.2.5
    https://github.com/pschatzmann/ESP32-A2DP.git#v1.8.11
    https://github.com/pschatzmann/arduino-libhelix.git#v0.9.4
    olikraus/U8g2@^2.35.30
    bblanchon/ArduinoJson@^7.4.2
    knolleary/PubSubClient@^2.8


; CORE_DEBUG_LEVEL must stay low. The IDF's Bluetooth stack logs from inside the
; audio path, and pushing that much text out of a 115200 baud UART stalls the
; I2S writer long enough to underrun the DMA buffers -- which sounds like static.
;
; USE_DS3231 compiles in the hardware clock. The module is fitted here, on the
; same I2C pair as the OLED (GPIO21 SDA / GPIO22 SCL), and it is the only time
; source that survives a power cut -- so the clock comes up right with no network
; and nothing to set by hand. Harmless on a board without one: soft_clock_begin()
; probes 0x68, logs that it found nothing, and falls back to network/NVS time.
build_flags =
    -DCORE_DEBUG_LEVEL=1
    -DUSE_DS3231=1

; The PSRAM cache workaround, switched off.
;
; The platform compiles every board the same way, which means with the silicon
; erratum workaround for ESP32 revisions below 3 -- a memw barrier after loads
; and stores, plus the matching multilib of libc. The bug it works around only
; exists when external SPI RAM is in use, and a WROOM-32D has none: this board
; has 16 MB of *flash* and 520 KB of internal SRAM, and nothing here ever
; touches a PSRAM address.
;
; It is switched off for room rather than for speed. IDF maps the whole of the
; workaround build of libc into IRAM, and IRAM is the one memory on this chip
; that cannot be traded for any other -- the Bluetooth controller alone takes
; 32 KB of it. Adding the WS2812 driver overflowed the segment by 216 bytes and
; would not link; without the barriers libc is smaller and it fits, with room
; left over. The barriers themselves cost throughput on the audio path too, so
; nothing is given up here.
build_unflags =
    -mfix-esp32-psram-cache-issue
    -mfix-esp32-psram-cache-strategy=memw


; ---------------------------------------------------------------------------
; esp32-blue-spk development firmware.
;
; Everything above, unchanged: the serial log narrates the boot, the console can
; drive every subsystem by hand, and `diag` prints the full report. This is the
; one to flash while you are working on the thing.
;
;   pio run -e esp32dev -t upload
[env:esp32dev]


; ---------------------------------------------------------------------------
; esp32-blue-spk release firmware.
;
;   pio run -e release -t upload
;
; What "release" means here, in the order it matters:
;
;   nothing talks          SERIAL_LOG=0 removes the running commentary -- not
;                          silences it, removes it. LOGF/LOGLN in app_config.h
;                          expand to nothing, so the format strings never reach
;                          the image. CONSOLE_ENABLED=0 takes the interactive
;                          console with it, and --gc-sections then drops every
;                          *_command() handler that had no other caller.
;                          DIAGNOSTICS_ENABLED=0 compiles diagnostics.cpp to
;                          nothing at all.
;
;                          The console mattering is not only about size. It is
;                          an unauthenticated control channel -- mode switches,
;                          factory reset, the DFPlayer's whole command set --
;                          for anybody who can reach two pads on the board. The
;                          dashboard behind it has a password; this did not.
;
;   CORE_DEBUG_LEVEL=0     the IDF's own logging, which is the half that was
;                          never ours to macro away. The note above about the
;                          Bluetooth stack logging from inside the audio path
;                          applies doubly here: at level 0 it cannot.
;
;   NDEBUG                 assert() compiles away, which is what it is for.
;
; The BOOT button still cycles radio modes and still runs the factory-reset
; countdown with no console at all, so a release unit is never stuck in a mode
; whose dashboard it cannot reach.
[env:release]
build_type = release

build_flags =
    ${env.build_flags}
    -DCORE_DEBUG_LEVEL=0
    -DNDEBUG
    -DSERIAL_LOG=0
    -DCONSOLE_ENABLED=0
    -DDIAGNOSTICS_ENABLED=0
    ; There is deliberately no -O2 here, and that was measured rather than
    ; assumed. Building this image at -O2 rather than the platform's -Os grows
    ; it by 148 kB -- and this chip executes from flash through a 32 kB
    ; instruction cache, so nearly all of that growth is cold code evicting hot
    ; code. The two files that genuinely are per-sample DSP ask for -O2
    ; themselves, with a #pragma at the top: see src/audio_eq.cpp and
    ; src/voice.cpp. That costs a couple of kilobytes instead of 148.
    ;
    ; Do not maintain errno for the maths functions. The float paths here --
    ; powf/sinf/cosf when a filter is designed, the biquads themselves -- never
    ; look at it, and leaving it out lets the compiler emit the FPU instruction
    ; and nothing else.
    ;
    ; Deliberately NOT -ffast-math: that implies -ffinite-math-only, under which
    ; the isnan() guard on the temperature sensor in telemetry.cpp is folded to
    ; false and a broken reading becomes a number.
    -fno-math-errno

; [env] above sets CORE_DEBUG_LEVEL=1, and adding a second -D for it on the same
; command line is a redefinition warning on every translation unit. Removing the
; inherited one is the tidy way to override it.
build_unflags =
    ${env.build_unflags}
    -DCORE_DEBUG_LEVEL=1

; The flash clock, doubled.
;
; Code executes from flash through the instruction cache on this chip, so the
; SPI clock is a direct multiplier on how fast a cache miss is served -- and an
; MP3 frame decode plus a five-band filter is a lot of cache misses. 40 MHz is
; the platform default for a generic esp32dev board because it is what every
; module is guaranteed to manage; 80 MHz is what a WROOM-32D actually has
; fitted, and it is the single largest speed change available here.
;
; DIO rather than QIO, on purpose. QIO is faster again -- four data lines rather
; than two -- but it needs GPIO9/GPIO10 free, and a module that has them wired
; for something else does not boot at all: no console, no dashboard, nothing to
; read. On a build whose whole point is that it does not talk, that is the wrong
; risk to take by default. If your board is known good, uncomment the QIO line
; and verify it boots before shipping it.
board_build.f_flash = 80000000L
board_build.flash_mode = dio
; board_build.flash_mode = qio
board_build.f_cpu = 240000000L

; Nothing is listening, so nothing decodes backtraces. Left as a plain monitor
; so `pio device monitor -e release` still shows the ROM bootloader's own output
; if a unit will not start.
monitor_filters = time


; ---------------------------------------------------------------------------
; The one remaining lever, and why it is commented out.
;
; The largest single consumer left on this chip is mbedtls, and almost all of it
; is two buffers: CONFIG_MBEDTLS_SSL_IN_CONTENT_LEN and ..._OUT_CONTENT_LEN,
; both 16384 bytes by default because that is the largest TLS record the
; standard permits. Together they are 32 kB, held for the life of a connection,
; and they are why an https radio stream needs ~112 kB when the same station
; over plain http needs ~67 kB.
;
; Almost no server sends 16 kB records. 4 kB each would cost nothing in practice
; and give back 24 kB -- enough that https streaming would fit alongside the
; dashboard, which today it does not.
;
; These are sdkconfig options, not compiler flags. They are baked into the
; precompiled Arduino libraries this platform ships, so build_flags cannot touch
; them. The pioarduino platform can rebuild those libraries with a custom
; sdkconfig -- that is what `custom_sdkconfig` below does -- and the price is:
;
;   * a full rebuild of the Arduino/IDF libraries, tens of minutes, once;
;   * a much deeper build tree, on a machine whose whole reason for the
;     `core_dir = C:/p` line at the top of this file is that Windows long paths
;     are DISABLED here and the IDF headers already do not fit in 260
;     characters. This is the likely failure, and it is a build failure rather
;     than a runtime one, so trying it costs time and nothing else;
;   * every future platform update rebuilds again.
;
; Uncomment, run `pio run -e release-tls`, and if it builds, an https station
; fits. If it does not build, enable Windows long-path support (see README) and
; try again, or stay on http:// stream URLs, which cost nothing and which every
; Icecast and Shoutcast station serves alongside the https one.
;
; [env:release-tls]
; extends = env:release
; custom_sdkconfig =
;     CONFIG_MBEDTLS_SSL_IN_CONTENT_LEN=4096
;     CONFIG_MBEDTLS_SSL_OUT_CONTENT_LEN=4096
;     CONFIG_MBEDTLS_DYNAMIC_BUFFER=y
;     CONFIG_MBEDTLS_DYNAMIC_FREE_CA_CERT=y


; ---------------------------------------------------------------------------
; A release build that still has the serial log.
;
; For the case that is genuinely hard otherwise: a unit that misbehaves only in
; the field, where you want the production timings, the production flash clock
; and no console -- but you do want to know what it says. Everything from
; [env:release], with SERIAL_LOG back on.
[env:release-verbose]
extends = env:release
build_flags =
    ${env:release.build_flags}
    -USERIAL_LOG
    -DSERIAL_LOG=1
monitor_filters = esp32_exception_decoder, time
