; ESP32 WROOM-32D  ->  Bluetooth A2DP sink  ->  PCM5102A I2S DAC
;
; NOTE: This must be a *classic* ESP32 (WROOM-32/32D/32E).
;       ESP32-S3 / C3 / S2 have BLE only and cannot run A2DP.
;
; Uses https://github.com/pschatzmann/ESP32-A2DP as documented upstream, which
; means the AudioTools I2SStream API rather than the retired legacy I2S driver.
; That combination needs Arduino core 3.x / IDF 5.x, which the official
; platformio espressif32 platform never shipped -- hence the pioarduino build.

; The IDF 5 package ships headers whose paths exceed the 260-char Windows limit,
; and this machine has LongPathsEnabled=0. Keeping the toolchain at a short root
; buys back enough characters to unpack it. Delete this section once long paths
; are enabled (see README) and the toolchain will live in ~/.platformio again.
[platformio]
core_dir = C:/p

[env]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/55.03.311/platform-espressif32.zip
board = esp32dev
framework = arduino

; Device Guard can block the unsigned esptool.exe launcher created in the
; PlatformIO virtual environment. Run the same installed package through the
; environment's allowed Python interpreter for both image creation and upload.
extra_scripts =
    pre:scripts/device_guard_pre.py
    pre:scripts/embed_web.py
    scripts/python_esptool.py

monitor_speed = 115200
monitor_filters = esp32_exception_decoder, time

; This board carries a 16 MB flash chip. The standard 16 MB layout provides two
; 6.25 MB OTA application slots plus 3.375 MB of filesystem space.
board_upload.flash_size = 16MB
board_build.partitions = default_16MB.csv

; Neither library is in the PlatformIO registry; both come straight from GitHub.
; ESP32-A2DP needs AudioTools -- it is a hard dependency now, not an option.
lib_deps =
    https://github.com/pschatzmann/arduino-audio-tools.git#v1.2.5
    https://github.com/pschatzmann/ESP32-A2DP.git#v1.8.11
    olikraus/U8g2@^2.35.30
    bblanchon/ArduinoJson@^7.4.2

; CORE_DEBUG_LEVEL must stay low. The IDF's Bluetooth stack logs from inside the
; audio path, and pushing that much text out of a 115200 baud UART stalls the
; I2S writer long enough to underrun the DMA buffers -- which sounds like static.
build_flags =
    -DCORE_DEBUG_LEVEL=1


; ---------------------------------------------------------------------------
; esp32-blue-spk production firmware.
[env:esp32dev]
